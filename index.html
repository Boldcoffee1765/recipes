<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Recipe</title>
<!--
  Paprika Home recipe page.
  This file holds no recipes. Paprika Home puts the recipe in the link after "#r=",
  and browsers never send that part of a link to the server. This script reads it,
  draws the recipe, and adds schema.org Recipe data so HomeView's recipe mode can use it.
-->
<style>
  :root {
    color-scheme: light dark;
    --accent: #cc3d24;
    --muted: #777;
    --bg: #fffdfb;
    --fg: #1d1b1a;
    --card: #f4efea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161414; --fg: #f2eeea; --card: #262220; --muted: #a39d98; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 20px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 22px 64px; }
  .hero { width: 100%; max-height: 380px; object-fit: cover; border-radius: 18px; display: block; }
  h1 { font-size: 1.9em; line-height: 1.15; margin: 0.5em 0 0.3em; }
  .description { color: var(--muted); margin: 0 0 1em; }
  .facts { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 1.2em; padding: 0; list-style: none; }
  .facts li { background: var(--card); border-radius: 12px; padding: 8px 14px; }
  .facts b { display: block; font-size: 0.65em; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  h2 { font-size: 1.25em; margin: 1.4em 0 0.5em; color: var(--accent); }
  ul.ingredients { padding-left: 1.1em; }
  ul.ingredients li { margin: 0.25em 0; }
  ul.ingredients li.heading { list-style: none; margin-left: -1.1em; font-weight: 600; margin-top: 0.8em; }
  ol.steps { padding-left: 1.4em; }
  ol.steps li { margin: 0 0 0.9em; padding-left: 0.2em; }
  ol.steps li::marker { color: var(--accent); font-weight: 700; }
  .notes { background: var(--card); border-radius: 14px; padding: 14px 18px; white-space: pre-wrap; }
  .source { margin-top: 1.6em; color: var(--muted); font-size: 0.85em; }
  .source a { color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding-top: 25vh; }
</style>
</head>
<body>
<main id="app">
  <p class="empty">Open a recipe from Paprika Home to show it here.</p>
</main>
<script>
(function () {
  "use strict";

  function readRecipe() {
    var hash = location.hash.replace(/^#/, "");
    var match = hash.match(/(?:^|&)r=([A-Za-z0-9_-]+)/);
    if (!match) {
      // Also accept ?r= in case a sharing step ever drops the # part.
      match = location.search.match(/[?&]r=([A-Za-z0-9_-]+)/);
    }
    if (!match) return null;
    var b64 = match[1].replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    try {
      var binary = atob(b64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) {
      return null;
    }
  }

  // Paprika stores times as text like "1 hr 15 mins"; schema.org wants ISO 8601 (PT1H15M).
  function isoDuration(text) {
    if (!text) return null;
    var t = String(text).toLowerCase();
    var h = t.match(/(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hour|hours)\b/);
    var m = t.match(/(\d+)\s*(?:m|min|mins|minute|minutes)\b/);
    if (!h && !m && /^\s*\d+\s*$/.test(t)) m = [t, t.trim()];
    if (!h && !m) return null;
    var minutes = (h ? Math.round(parseFloat(h[1]) * 60) : 0) + (m ? parseInt(m[1], 10) : 0);
    if (!minutes) return null;
    var out = "PT";
    if (minutes >= 60) out += Math.floor(minutes / 60) + "H";
    if (minutes % 60) out += (minutes % 60) + "M";
    return out;
  }

  function safeURL(value) {
    return typeof value === "string" && /^https?:\/\//i.test(value) ? value : null;
  }

  function isHeading(line) {
    return /:\s*$/.test(line) && line.length < 40;
  }

  function el(tag, attrs, text) {
    var node = document.createElement(tag);
    if (attrs) for (var key in attrs) if (attrs[key] != null) node.setAttribute(key, attrs[key]);
    if (text != null) node.textContent = text;
    return node;
  }

  var r = readRecipe();
  if (!r || !r.n) return;

  var ingredients = Array.isArray(r.i) ? r.i : [];
  var steps = Array.isArray(r.d) ? r.d : [];
  var image = safeURL(r.img);

  document.title = r.n;

  // schema.org Recipe data, which recipe-aware browsers read.
  var ld = {
    "@context": "https://schema.org",
    "@type": "Recipe",
    "name": r.n,
    "recipeIngredient": ingredients.filter(function (l) { return !isHeading(l); }),
    "recipeInstructions": steps.map(function (s, i) {
      return { "@type": "HowToStep", "position": i + 1, "text": s };
    })
  };
  if (image) ld.image = [image];
  if (r.desc) ld.description = r.desc;
  if (r.s) ld.recipeYield = r.s;
  var pt = isoDuration(r.pt), ct = isoDuration(r.ct), tt = isoDuration(r.tt);
  if (pt) ld.prepTime = pt;
  if (ct) ld.cookTime = ct;
  if (tt) ld.totalTime = tt;
  if (r.src) ld.author = { "@type": "Organization", "name": r.src };
  var script = document.createElement("script");
  script.type = "application/ld+json";
  script.textContent = JSON.stringify(ld);
  document.head.appendChild(script);

  // The visible page, also marked up with schema.org microdata.
  var app = document.getElementById("app");
  app.textContent = "";
  var article = el("article", { itemscope: "", itemtype: "https://schema.org/Recipe" });

  if (image) {
    var hero = el("img", { class: "hero", src: image, alt: r.n, itemprop: "image" });
    hero.onerror = function () { hero.remove(); };
    article.appendChild(hero);
  }
  article.appendChild(el("h1", { itemprop: "name" }, r.n));
  if (r.desc) article.appendChild(el("p", { class: "description", itemprop: "description" }, r.desc));

  var facts = el("ul", { class: "facts" });
  [["Servings", r.s, "recipeYield", null], ["Prep", r.pt, "prepTime", pt],
   ["Cook", r.ct, "cookTime", ct], ["Total", r.tt, "totalTime", tt]].forEach(function (f) {
    if (!f[1]) return;
    var li = el("li");
    li.appendChild(el("b", null, f[0]));
    var value = el(f[3] ? "time" : "span", { itemprop: f[2], datetime: f[3] }, f[1]);
    li.appendChild(value);
    facts.appendChild(li);
  });
  if (facts.childNodes.length) article.appendChild(facts);

  if (ingredients.length) {
    article.appendChild(el("h2", null, "Ingredients"));
    var ul = el("ul", { class: "ingredients" });
    ingredients.forEach(function (line) {
      if (isHeading(line)) ul.appendChild(el("li", { class: "heading" }, line.replace(/:\s*$/, "")));
      else ul.appendChild(el("li", { itemprop: "recipeIngredient" }, line));
    });
    article.appendChild(ul);
  }

  if (steps.length) {
    article.appendChild(el("h2", null, "Directions"));
    var ol = el("ol", { class: "steps" });
    steps.forEach(function (step) {
      ol.appendChild(el("li", { itemprop: "recipeInstructions" }, step));
    });
    article.appendChild(ol);
  }

  if (r.notes) {
    article.appendChild(el("h2", null, "Notes"));
    article.appendChild(el("div", { class: "notes" }, r.notes));
  }

  var sourceURL = safeURL(r.u);
  if (r.src || sourceURL) {
    var p = el("p", { class: "source" }, "Source: ");
    if (sourceURL) p.appendChild(el("a", { href: sourceURL, rel: "noreferrer" }, r.src || sourceURL));
    else p.appendChild(document.createTextNode(r.src));
    article.appendChild(p);
  }

  app.appendChild(article);

  window.addEventListener("hashchange", function () { location.reload(); });
})();
</script>
</body>
</html>
